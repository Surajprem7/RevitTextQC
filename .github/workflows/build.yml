name: Build and release

# Every push and pull request is built and tested.
# Pushing a tag such as v0.2.0 also publishes a GitHub release with one zip per Revit version;
# installed add-ins find that release and update themselves.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Read-only by default. Only the release job, which runs for version tags, may write.
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      # Actions are pinned to an exact commit, so a changed tag upstream cannot change what builds a release.
      # Dependabot (.github/dependabot.yml) proposes updates to these pins.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test tests/RevitTextQC.Tests/RevitTextQC.Tests.csproj -c Release --nologo

      - name: Build and package
        shell: pwsh
        run: |
          $version = ''
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.TrimStart('v')
            if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Tag must look like v1.2.3, got $env:GITHUB_REF_NAME" }
          }
          ./build.ps1 -Package -Version $version

      # One Setup.exe with every Revit version inside (no internet needed to install).
      - name: Build Setup.exe
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '0.0.0' }
          & $iscc "/DAppVersion=$version" installer/RevitTextQC.iss
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup failed' }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: RevitTextQC
          path: |
            dist/*.zip
            dist/RevitTextQC-Setup.exe
            install.ps1
            Install-TextQC.bat

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: RevitTextQC

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/RevitTextQC-Setup.exe install.ps1 Install-TextQC.bat --title "Text QC $GITHUB_REF_NAME" --generate-notes
